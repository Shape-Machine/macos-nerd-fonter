# Tests and builds the app on every pull request; on a version tag (v1.2.3) also publishes a
# GitHub release with a downloadable, unsigned NerdFonter.zip (universal: Apple silicon + Intel).
name: Build

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0.0; fi
          VERSION="$VERSION" UNIVERSAL=1 ./scripts/build-app.sh
          ditto -c -k --keepParent build/NerdFonter.app NerdFonter.zip

      - name: Keep the build for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: NerdFonter
          path: NerdFonter.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" NerdFonter.zip --title "Nerd Fonter $GITHUB_REF_NAME" --generate-notes
